<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color It!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html"><span class="logo-dot"></span> Coloring Book Fun</a>
  <nav><a class="btn btn-ghost" href="index.html">&larr; Back home</a></nav>
</header>

<main>
  <h1 id="pageTitle">Color It!</h1>
  <div id="hintBanner"></div>
  <div id="progressRow" class="progress-row" style="margin-bottom:16px;"></div>

  <div class="workspace">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="paintCanvas"></canvas>
    </div>
    <div class="side-panel">
      <div class="card">
        <div class="toolbar">
          <button class="btn btn-sm" id="undoBtn">↩️ Undo</button>
          <button class="btn btn-sm btn-ghost" id="resetBtn">🔄 Reset</button>
          <button class="btn btn-sm btn-ghost" id="downloadBtn">💾 Save PNG</button>
        </div>
        <h3 style="margin-bottom:8px;">Colors</h3>
        <div class="palette" id="palette"></div>
        <div class="custom-color-row">
          <input type="color" id="customColor" value="#ff6b6b">
          <span class="form-hint">Pick any color</span>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="celebration" class="celebration" style="display:none;">
  <div class="box">
    <div class="emoji">🎉</div>
    <h2>All done!</h2>
    <p>Great coloring job!</p>
    <button class="btn btn-primary" id="celebrationClose">Yay!</button>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/samples.js"></script>
<script src="js/floodfill.js"></script>
<script src="js/color.js"></script>
</body>
</html>
